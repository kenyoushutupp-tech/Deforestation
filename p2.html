<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deFORESTation - Table of Content</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Roboto:wght@300&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Paper texture effect */
            background-color: #edebe4;
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 60px 80px;
            overflow: hidden;
            position: relative;
            font-family: 'Playfair Display', serif;
        }

        /* YEAR TOP RIGHT */
        .year-label {
            position: absolute;
            top: 40px;
            right: 60px;
            font-weight: bold;
            font-size: 16px;
            color: #333;
            font-family: 'Roboto', sans-serif;
        }

        /* RETURN BUTTON TOP LEFT */
        .return-btn {
            position: absolute;
            top: 40px;
            left: 60px;
            background: none;
            border: none;
            color: #008450;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            font-family: 'Roboto', sans-serif;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .return-btn:hover {
            text-decoration: underline;
        }

        /* MAIN TITLE */
        .header-container {
            align-self: flex-end;
            margin-bottom: 50px;
            text-align: right;
        }

        .main-title {
            font-style: italic;
            font-size: 100px;
            color: #008450;
            line-height: 0.9;
        }

        /* GRID NAVIGATION */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 100px;
            row-gap: 20px;
            margin-top: auto;
            margin-bottom: 40px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #008450;
            border-bottom: 1px solid rgba(0, 132, 80, 0.3);
            padding: 15px 0;
            transition: all 0.3s ease;
        }

        .nav-item:hover {
            border-bottom: 1px solid #008450;
            padding-left: 10px;
            background-color: rgba(0, 132, 80, 0.05);
        }

        .arrow {
            font-size: 30px;
            margin-right: 20px;
            transform: rotate(45deg); /* Downward right arrow style */
        }

        .label {
            font-size: 45px;
            font-style: normal;
        }

    </style>
</head>
<body>

    <button class="return-btn" onclick="location.href='index.html'">
        ← Return
    </button>

    <div class="year-label">2025</div>

    <header class="header-container">
        <h1 class="main-title">Table of<br>Content</h1>
    </header>

    <nav class="content-grid">
        <a href="p3-1.html" class="nav-item">
            <span class="arrow">↘</span>
            <span class="label">Introduction</span>
        </a>
        
        <a href="p3-4.html" class="nav-item">
            <span class="arrow">↘</span>
            <span class="label">Statistics</span>
        </a>

        <a href="p3-2.html" class="nav-item">
            <span class="arrow">↘</span>
            <span class="label">Objectives</span>
        </a>

        <a href="p3-5.html" class="nav-item">
            <span class="arrow">↘</span>
            <span class="label">Solution</span>
        </a>

        <a href="p3-3.html" class="nav-item">
            <span class="arrow">↘</span>
            <span class="label">Problem</span>
        </a>

        <a href="p3-6.html" class="nav-item">
            <span class="arrow">↘</span>
            <span class="label">How can I help?</span>
        </a>
    </nav>

</body>
</html>
